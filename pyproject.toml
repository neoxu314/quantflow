[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantflow"
version = "0.1.0"
description = "Stock Quantitative Analysis System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "baostock>=0.8.9",
    "tushare>=1.3.0",
    "akshare>=1.10.0",
    "yfinance>=0.2.30",
    "yahooquery>=2.3.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "exchange-calendars>=4.13.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8",
    "httpx>=0.28,<1",
    "curl-cffi>=0.7,<1",
    "pytest-playwright>=0.10,<1",
    "platformdirs>=4,<5",
    "setuptools>=61",
    "wheel",
]
viz = [
    "matplotlib>=3.7.0",
    "mplfinance>=0.12.10",
]

[project.scripts]
quantflow-scan = "quantflow.cli:scan"
quantflow-monitor = "quantflow.cli:monitor"
quantflow-tasks = "quantflow.cli:task_run"
quantflow-web = "quantflow.cli:web"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quantflow.web" = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live external provider tests, enabled with --live-market",
    "browser: Web system or browser tests, enabled with --run-browser",
]

[tool.coverage.run]
source_pkgs = ["quantflow"]

[tool.coverage.paths]
quantflow = ["src/quantflow", "*/quantflow-tests-*/project/src/quantflow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
