name: QuantFlow tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/frontend/package-lock.json
      - name: Install project and browser
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/web/frontend
      - name: Test frontend and verify shipped JavaScript
        run: |
          npm test --prefix tests/web/frontend
          generated="$(mktemp -d)"
          tests/web/frontend/node_modules/.bin/tsc --project src/quantflow/web/static/tsconfig.json --removeComments --outDir "$generated"
          diff -u src/quantflow/web/static/app.js "$generated/app.js"
          diff -u src/quantflow/web/static/utils.js "$generated/utils.js"
      - name: Run offline and browser regressions
        run: python -m pytest --run-browser --junitxml=test-results/pytest.xml --tracing retain-on-failure --output=test-results/browser
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: quantflow-test-results
          path: test-results/
          if-no-files-found: ignore
