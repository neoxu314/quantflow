# Indicator default configuration
# This file defines default parameters for each indicator used by QuantFlow.
# The factory will merge these overrides with the indicator's built-in defaults.
indicators:
  KDJ:
    enabled: true
    params:
      n: 9
      m1: 3
      m2: 3
  MACD:
    enabled: true
    params:
      fast_period: 12
      slow_period: 26
      signal_period: 9
  RSI:
    enabled: true
    params:
      period: 14
  BOLL:
    enabled: true
    params:
      period: 20
      std_dev: 2.0
  VolumeMA:
    enabled: true
    params:
      periods: [5, 10, 20]
  DualLine:
    enabled: true
    params:
      ema_period: 10
      ma_periods: [14, 28, 57, 114]
  BrickChart:
    enabled: true
    params:
      period: 4
      smooth1_n: 4
      smooth2_n: 6
      shift: 4.0
  Washout:
    enabled: true
    params:
      n1: 3
      n2: 21
