version: "0.1.0"

data:
  markets:
    cn:
      primary: baostock
      fallback: tushare
      fundamental: tushare
    hk:
      primary: yfinance
      fallback: akshare
    us:
      primary: yfinance
    jp:
      primary: yfinance
    kr:
      primary: yfinance
    sector:
      primary: akshare
  
  defaults:
    adjust: qfq
    period: d

tushare:
  token: ""

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

lookback:
  calendar_multiplier: 2
  buffer_days: 30

yfinance:
  batch:
    chunk_size: 50
    sleep_min: 5
    sleep_max: 12