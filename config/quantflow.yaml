version: 0.1.0
data:
  markets:
    cn:
      primary: baostock
      fallback: tushare
    hk:
      primary: yfinance
      fallback: akshare
    us:
      primary: yfinance
    jp:
      primary: yfinance
    kr:
      primary: yfinance
    sector:
      primary: akshare
  defaults:
    adjust: qfq
tushare:
  token: ''
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
lookback:
  calendar_multiplier: 2
  buffer_days: 30
yfinance:
  batch:
    chunk_size: 35
    sleep_min: 10
    sleep_max: 20
    retry_max_attempts: 3
    retry_base_delay: 30
web:
  port: 8082
  host: 127.0.0.1
