version: 0.1.0
data:
  markets:
    cn:
      primary: baostock
      fallback: tushare
    hk:
      primary: yahooquery
      fallback: yfinance
    us:
      primary: yahooquery
      fallback: yfinance
    jp:
      primary: yahooquery
      fallback: yfinance
    kr:
      primary: yahooquery
      fallback: yfinance
    sector:
      primary: akshare
  defaults:
    adjust: qfq
tushare:
  token: ''
logging:
  console_level: INFO
  file_enabled: true
  file_level: DEBUG
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
lookback:
  calendar_multiplier: 2
  buffer_days: 30
yfinance:
  batch:
    chunk_size: 35
    sleep_min: 10
    sleep_max: 20
    retry_max_attempts: 3
    retry_base_delay: 30
    cooldown_base: 60
    recovery_max_passes: 3
    recovery_chunk_size: 10
yahooquery:
  batch:
    chunk_size: 100
    sleep_min: 0.5
    sleep_max: 2
    max_workers: 20
web:
  port: 8082
  host: 127.0.0.1
